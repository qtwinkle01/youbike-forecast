services:
  collector:
    build: .
    container_name: youbike-collector
    restart: unless-stopped
    environment:
      INTERVAL_SECONDS: "300"
      WEATHER_INTERVAL_SECONDS: "3600"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dataset / model / app environment. Not started by `docker compose up`;
  # use e.g.  docker compose run --rm ml python build_dataset.py
  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: Dockerfile.ml
    working_dir: /work
    volumes:
      - .:/work

  # Streamlit app:  docker compose --profile app up app   -> http://localhost:8502
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.ml
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "8502:8501"
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false --server.fileWatcherType poll
